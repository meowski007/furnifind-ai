name: FurniFind AI Continuous Integration

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-quality-and-test:
    name: Backend Lint, Test & Evaluation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint with Ruff
        run: |
          ruff check app tests scripts
          ruff format --check app tests scripts

      - name: Generate Sample Images & Ingest Catalogue
        run: |
          python scripts/generate_sample_images.py
          python scripts/ingest_data.py --force

      - name: Run Python Automated Tests (Pytest)
        run: |
          pytest -v

      - name: Run Search Retrieval Benchmark
        run: |
          python -m app.evaluation.run

  frontend-quality-and-test:
    name: Frontend Lint, Typecheck & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Run Vitest Unit Tests
        working-directory: frontend
        run: npm run test

      - name: Build React Application
        working-directory: frontend
        run: npm run build
